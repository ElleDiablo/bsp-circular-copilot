[project]
name = "bsp-circular-copilot"
version = "0.1.0"
description = "AI assistant that answers questions from BSP circulars, with citations, or refuses."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "langchain-groq>=1.2.1",
    "langchain-ollama>=1.2.0",
    "langgraph>=1.2.24",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.9",
    "pypdf>=7.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
